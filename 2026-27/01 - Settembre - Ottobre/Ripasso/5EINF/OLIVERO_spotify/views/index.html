<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Catalog - MVC + AJAX</title>
    <link rel="stylesheet" href="css/index.css">
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/libreria.js"></script>
    <script src="js/index.js"></script>
</head>
<body>

<div class="container">
    <h1>🎵 Spotify Catalog</h1>

    <div class="form-section">
        <h2>Aggiungi una nuova canzone</h2>
        <form id="formAggiungi">
            <div class="form-row">
                <div class="form-group">
                    <label for="inputTitolo">Titolo:</label>
                    <input type="text" id="inputTitolo" placeholder="Es: Blinding Lights" required>
                </div>
                <div class="form-group">
                    <label for="inputArtista">Artista:</label>
                    <input type="text" id="inputArtista" placeholder="Es: The Weeknd" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="inputAlbum">Album:</label>
                    <input type="text" id="inputAlbum" placeholder="Es: After Hours">
                </div>
                <div class="form-group">
                    <label for="inputAnno">Anno:</label>
                    <input type="number" id="inputAnno" placeholder="Es: 2019" min="1900" max="2099">
                </div>
            </div>
            <button type="submit" class="btn-aggiungi">Aggiungi Canzone</button>
        </form>
    </div>

    <div class="search-section">
        <label for="inputRicerca">Cerca per titolo o artista:</label>
        <input type="text" id="inputRicerca" placeholder="Cerca canzoni...">
    </div>

    <ul id="listaCanzoni"></ul>
</div>

</body>
</html>
